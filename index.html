<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第三、四課複習站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: an exercise book — sticky header with the seven test sections (I–VII, same order as the test) as tabs; one section on screen at a time, green 田字格 grid, teacher's red pen only for marks. */
:root{
  --paper:#EAF1EC; --sheet:#FBFDFB; --ink:#1A2A23; --muted:#5A6D64; --rule:#CCDAD2;
  --grid:#9CC4AE; --pen:#1E5C86; --pen-soft:#DCEAF4; --red:#C0392B; --red-soft:#F8E1DE;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --chip:#E1EAE4;
  --f-han:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-hans:"Noto Serif SC","Songti SC","STSong",serif;
  --f-py:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --box:clamp(96px,22vw,132px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101815; --sheet:#17221D; --ink:#E2ECE6; --muted:#93A79D; --rule:#2A3A33;
  --grid:#3E6150; --pen:#79B6E0; --pen-soft:#1D3242; --red:#F07B6E; --red-soft:#3B201D;
  --ok:#6DC290; --ok-soft:#1A3326; --chip:#22302A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101815; --sheet:#17221D; --ink:#E2ECE6; --muted:#93A79D; --rule:#2A3A33;
  --grid:#3E6150; --pen:#79B6E0; --pen-soft:#1D3242; --red:#F07B6E; --red-soft:#3B201D;
  --ok:#6DC290; --ok-soft:#1A3326; --chip:#22302A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-ui);margin:0}
.han{font-family:var(--f-han)}
body.s .han{font-family:var(--f-hans)}
.py{font-family:var(--f-py)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px max(16px,3vw) 8px}
.brand{display:grid;gap:2px;min-width:0}
.brand b{font:700 1.3rem/1.15 var(--f-han);letter-spacing:.04em}
body.s .brand b{font-family:var(--f-hans)}
.brand span{font-size:.74rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--sheet)}
.seg button{border:0;background:none;border-radius:999px;padding:4px 13px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ghost{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.84rem;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(16px,3vw);scrollbar-width:thin}
nav button{flex:none;border:0;background:none;padding:8px 10px 9px;border-bottom:3px solid transparent;display:grid;justify-items:start;gap:0;min-width:78px}
nav .n{font:600 .7rem/1 var(--f-ui);color:var(--muted);letter-spacing:.08em}
nav .l{font-size:1rem;line-height:1.35;white-space:nowrap}
nav .sc{font:600 .7rem/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
nav .sc.full{color:var(--ok)}
nav button[aria-selected="true"]{border-bottom-color:var(--pen)}
nav button[aria-selected="true"] .n{color:var(--pen)}

main{max-width:880px;margin:0 auto;padding-block:22px 48px;padding-inline:max(16px,3vw)}
.sec{display:grid;gap:18px}
.sec-h{display:grid;gap:4px}
.sec-h h2{margin:0;font:700 1.45rem/1.25 var(--f-han);text-wrap:balance}
body.s .sec-h h2{font-family:var(--f-hans)}
.sec-h h2 small{font:500 .9rem var(--f-ui);color:var(--muted);margin-left:8px}
.sec-h p{margin:0;color:var(--muted);max-width:62ch;font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:.86rem}
.pill[aria-pressed="true"]{background:var(--pen-soft);border-color:var(--pen)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 14px;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.btn:disabled{opacity:.4;cursor:default}
.say{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none;padding:0}
.say:hover{color:var(--pen);border-color:var(--pen)}
.say svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px}
.mark{font:700 1.05rem/1 var(--f-ui)}
.mark.ok{color:var(--ok)} .mark.no{color:var(--red)}
.fb{font-size:.9rem;color:var(--muted)}
.fb b{color:var(--ink)}

/* I. writing */
.w-card{display:grid;gap:14px;justify-items:center;text-align:center}
.w-meta{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.w-py{font:600 clamp(2rem,6vw,2.8rem)/1.1 var(--f-py)}
.w-en{font:italic 400 1.1rem var(--f-py);color:var(--muted)}
.w-count{font:600 .75rem/1 var(--f-ui);color:var(--muted);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.boxes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.box{position:relative;width:var(--box);aspect-ratio:1;max-width:100%;border:1.5px solid var(--red);background:var(--sheet);touch-action:none}
.box svg.g{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.box svg.g line{stroke:var(--grid);stroke-width:1;stroke-dasharray:4 4}
.box .hw{position:absolute;inset:0}
.box.cur{box-shadow:0 0 0 3px var(--pen-soft)}
.box .fall{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--box)*.7);color:var(--muted)}
.w-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.w-res{min-height:1.6em}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:3px 9px;font-size:1rem;line-height:1.5}
.strip button.ok{background:var(--ok-soft);border-color:var(--ok)}
.strip button.no{background:var(--red-soft);border-color:var(--red)}
.strip button.cur{outline:2px solid var(--pen);outline-offset:1px}

/* II. pinyin */
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.p-item{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.p-item.ok{border-color:var(--ok);background:var(--ok-soft)}
.p-item.no{border-color:var(--red)}
.p-top{display:flex;align-items:center;gap:10px}
.p-w{font-size:2rem;line-height:1.2}
.p-en{font-size:.82rem;color:var(--muted);margin-left:auto;text-align:right}
.p-in{display:flex;gap:6px}
.p-in input{flex:1;min-width:0;font:1.05rem var(--f-py);padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.p-in button{padding:6px 12px}
.p-fb{font-size:.88rem;min-height:1.3em}
.p-fb .py{font-size:1rem}
.tones{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--muted)}
.tones code{font:1rem var(--f-py);background:var(--chip);border-radius:6px;padding:1px 6px;color:var(--ink)}

/* III / IV choices */
.q-list{display:grid;gap:10px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.q-s{font-size:1.35rem;line-height:1.6;display:flex;gap:10px;align-items:baseline}
.q-s .num{font:600 .8rem var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.6em}
.q-s .blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--muted);text-align:center;color:var(--pen)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 16px;font-size:1.2rem;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--red-soft);border-color:var(--red);text-decoration:line-through;text-decoration-color:var(--red)}
.opt:disabled{cursor:default}
.opt.en{font-size:.98rem;font-family:var(--f-ui)}
.rad-big{font-size:2.6rem;line-height:1;width:1.3em;text-align:center}
.q-x{font-size:.9rem;color:var(--muted)}

/* V fill */
.bank{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:1px dashed var(--grid);border-radius:10px;background:var(--sheet)}
.bw{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:4px 12px;font-size:1.2rem}
.bw[aria-pressed="true"]{background:var(--pen);color:var(--sheet);border-color:var(--pen)}
.bw.used{opacity:.35}
.para{font-size:1.35rem;line-height:2.3;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.slot{display:inline-block;min-width:3.2em;margin:0 3px;padding:0 6px;border:0;border-bottom:2px solid var(--muted);background:none;font-size:1.25rem;line-height:1.5;color:var(--pen);vertical-align:baseline}
.slot.empty::after{content:"\00a0"}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.no{border-color:var(--red);background:var(--red-soft)}
.slot .n{font:600 .62rem var(--f-ui);color:var(--muted);vertical-align:super;margin-right:3px}

/* VI translate */
.t-item{display:grid;gap:10px}
.t-en{font:italic 400 1.15rem var(--f-py)}
.t-item textarea{width:100%;font-size:1.25rem;line-height:1.5;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;min-height:52px}
.t-model{display:grid;gap:4px;border-left:3px solid var(--red);padding:2px 0 2px 12px}
.t-model .m{font-size:1.25rem}
.t-model .tip{font-size:.9rem;color:var(--muted)}

/* VII reading */
.passage{font-size:1.3rem;line-height:2.2;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.cz{display:inline-flex;gap:2px;border:1px dashed var(--grid);border-radius:8px;padding:0 3px;margin:0 2px;vertical-align:baseline;line-height:1.6}
.cz button{border:0;background:none;border-radius:6px;padding:0 6px;font-size:1.15rem}
.cz button:hover:not(:disabled){background:var(--pen-soft)}
.cz button.ok{background:var(--ok-soft);color:var(--ok)}
.cz button.no{background:var(--red-soft);text-decoration:line-through}
.cz button:disabled{cursor:default}
.tf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center}
.tf .opts{flex-wrap:nowrap}
.tf .opt{font-family:var(--f-ui);font-size:.95rem;padding:4px 12px}
.tf .s{font-size:1.2rem}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:520px){
  .q-s{font-size:1.2rem}
  .para,.passage{font-size:1.2rem;padding:14px}
  .tf{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><b>第三、四課 複習</b><span>Test Three review · Lessons 3 &amp; 4</span></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Script">
        <button id="m-t" data-m="t" aria-pressed="true">繁體</button>
        <button id="m-s" data-m="s" aria-pressed="false">简体</button>
      </div>
      <button class="ghost" id="reset" type="button">Start over</button>
    </div>
  </div>
  <nav id="nav" role="tablist" aria-label="Test sections"></nav>
</header>

<main id="main"></main>

const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};

function rng(seed){ let x = seed * 9301 + 49297; return () => (x = (x * 9301 + 49297) % 233280) / 233280; }
function shuffle(arr, seed){ const a = arr.slice(), r = rng(seed); for (let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let wIdx = 0, writers = [], wState = null;

  const boxes = el('div',{class:'boxes'});
  card.append(boxes);
  const res = el('div',{class:'w-res fb'});
  const actions = el('div',{class:'w-actions'},
    el('button',{class:'btn', type:'button', onclick:hint}, 'Hint'),
    el('button',{class:'btn', type:'button', onclick:showAns}, 'Show answer'),
    el('button',{class:'btn', type:'button', onclick:()=>startWord()}, 'Try again'),
    el('button',{class:'btn primary', type:'button', onclick:()=>{ wIdx = set[(pos+1)%set.length]; render(); }}, 'Next word →'));
  card.append(res, actions);
  sec.append(card);

  const strip = el('div',{class:'strip', 'aria-label':'Words'});
  for (const i of set){
    const st = S.w[i];
    strip.append(el('button',{type:'button', class:'han' + (st?' '+st:'') + (i===wIdx?' cur':''), title:DATA.write[i].py,
      onclick:()=>{ wIdx=i; render(); }}, Z(DATA.write[i].w)));
  }
  sec.append(el('div',{class:'fb'}, 'Green = written without help. Red = needed the answer. Tap any word to practise it.'), strip);

  // build writers after the boxes are in the document
  requestAnimationFrame(() => startWord());

  function colors(){
    const cs = getComputedStyle(document.documentElement);
    const g = n => cs.getPropertyValue(n).trim();
    return {ink:g('--ink'), pen:g('--pen'), grid:g('--grid'), red:g('--red'), muted:g('--muted'), ok:g('--ok')};
  }
  function startWord(){
    boxes.textContent = ''; writers = []; res.textContent = '';
    const chars = [...Z(w.w)].filter(c => c.trim());
    wState = {i:0, mistakes:0, helped:false, chars};
    const c = colors();
    const size = boxes.getBoundingClientRect().width ? Math.min(132, Math.max(96, Math.round(window.innerWidth*0.22))) : 120;
    chars.forEach((ch, k) => {
      const box = el('div',{class:'box' + (k===0?' cur':'')});
      box.innerHTML = '<svg class="g" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></svg>';
      const host = el('div',{class:'hw'}); box.append(host); boxes.append(box);
      const sz = box.getBoundingClientRect().width || size;
      if (window.HanziWriter && DATA.strokes[ch]) {
        const wr = HanziWriter.create(host, ch, {
          width: sz, height: sz, padding: Math.round(sz*0.08),
          showCharacter:false, showOutline:false, showHintAfterMisses:3,
          strokeColor:c.ink, outlineColor:c.grid, drawingColor:c.pen, highlightColor:c.red,
          drawingWidth: Math.max(4, Math.round(sz/22)),
          charDataLoader:(x, done) => done(DATA.strokes[x])
        });
        writers.push(wr);
      } else {
        box.append(el('div',{class:'fall han'}, '?'));
        writers.push(null);
      }
    });
    quizNext();
  }
  function quizNext(){
    const k = wState.i;
    [...boxes.children].forEach((b,j)=>b.classList.toggle('cur', j===k));
    if (k >= wState.chars.length) return finish();
    const wr = writers[k];
    if (!wr){ res.textContent = 'Stroke data unavailable for this character. Use Show answer.'; return; }
    wr.quiz({
      onMistake: () => { wState.mistakes++; },
      onComplete: () => { wState.i++; quizNext(); }
    });
  }
  function finish(){
    const ok = !wState.helped && wState.mistakes <= wState.chars.length * 2;
    S.w[wIdx] = ok ? 'ok' : 'no'; save(); refreshNav();
    [...strip.children].forEach(b => { if (b.classList.contains('cur')) { b.classList.remove('ok','no'); b.classList.add(ok?'ok':'no'); }});
    res.innerHTML = '';
    res.append(el('span',{class:'mark ' + (ok?'ok':'no')}, ok ? '✓ ' : '✗ '),
      ok ? `Well written. ${wState.mistakes ? wState.mistakes + ' stroke slip(s).' : 'No mistakes.'}`
         : `Done with help. Try this word again later.`);
  }
  function hint(){
    const wr = writers[wState.i]; if (!wr) return;
    wState.helped = true; wr.showOutline();
  }
  function showAns(){
    wState.helped = true;
    writers.forEach(wr => wr && wr.cancelQuiz());
    let k = 0;
    const next = () => { if (k >= writers.length) { S.w[wIdx]='no'; save(); refreshNav(); res.textContent='Watch the stroke order, then press Try again.'; return; }
      const wr = writers[k++]; if (!wr) return next();
      wr.hideOutline(); wr.animateCharacter({onComplete: next}); };
    next();
  }
  return sec;
}

/* ===== II. Pinyin ===== */
const TONE = {'ā':'a1','á':'a2','ǎ':'a3','à':'a4','ē':'e1','é':'e2','ě':'e3','è':'e4','ī':'i1','í':'i2','ǐ':'i3','ì':'i4',
  'ō':'o1','ó':'o2','ǒ':'o3','ò':'o4','ū':'u1','ú':'u2','ǔ':'u3','ù':'u4','ǖ':'v1','ǘ':'v2','ǚ':'v3','ǜ':'v4','ü':'v0'};
function parsePy(str){
  let letters = '', tones = [];
  const s = str.toLowerCase().replace(/u:/g,'v').normalize('NFC');
  for (const ch of s){
    if (TONE[ch]) { letters += TONE[ch][0]; const t = +TONE[ch][1]; if (t) tones.push(t); }
    else if (/[1-4]/.test(ch)) tones.push(+ch);
    else if (/[a-z]/.test(ch)) letters += ch;
  }
  return {letters, tones: tones.join('')};
}
function checkPy(input, item){
  const got = parsePy(input);
  const answers = [item.py, ...item.alt].map(parsePy);
  if (answers.some(a => a.letters===got.letters && a.tones===got.tones)) return 'ok';
  if (answers.some(a => a.letters===got.letters)) return 'tone';
  return 'no';
}

function mcq(store, key, opts, ans, onDone, cls=''){
  const wrap = el('div',{class:'opts'});
  const prev = store[key];
  opts.forEach((o, j) => {
    const b = el('button',{class:'opt ' + cls, type:'button'}, o);
    b.addEventListener('click', () => {
      if (store[key]) return;
      store[key] = j===ans ? 'ok' : 'no'; save(); refreshNav();
      paint(j); onDone && onDone(j===ans);
    });
    wrap.append(b);
  });
  function paint(pick){
    [...wrap.children].forEach((b,j) => { b.disabled = true; if (j===ans) b.classList.add('ok'); else if (j===pick) b.classList.add('no'); });
  }
  if (prev) paint(prev==='ok' ? ans : -1);
  return wrap;
}

function radQs(){
  const qs = [];
  DATA.rad.forEach((r, i) => {
    const pool = shuffle(DATA.rad.filter((_,j)=>j!==i).map(x=>x.m).concat(DATA.radDistract), i+3).slice(0,3);
    const opts = shuffle([r.m, ...pool], i+11);
    qs.push({kind:'m', r, opts, a:opts.indexOf(r.m)});
  });
  const picks = [];
  DATA.rad.forEach((r, i) => { const ex = r.ex.t; [...ex].slice(0,2).forEach((c, k) => picks.push({ri:i, k, c})); });
  shuffle(picks, 7).forEach((p, n) => qs.push({kind:'c', p, a:p.ri}));
  return qs;
}

    } else {
      const ch = Z({t:q.p.c, s:DATA.rad[q.p.ri].ex.s[[...DATA.rad[q.p.ri].ex.t].indexOf(q.p.c)]});
      list.append(el('div',{class:'q'},
        el('div',{class:'q-s'}, el('span',{class:'num'}, 'B'+(i-DATA.rad.length+1)), el('span',{class:'rad-big han'}, ch),
          el('span',{class:'q-x'}, 'Which radical?')),
        mcq(S.r, i, DATA.rad.map(r => Z(r.r)), q.a, null, 'han')));
    }
  });
  sec.append(list);
  return sec;
}

/* ===== V. Fill in ===== */
function blanks(){ return DATA.fill.map((p,i)=>Array.isArray(p)?i:-1).filter(i=>i>=0); }
let picked = null; let filled = {};
function renderFill(){
  const sec = el('section',{class:'sec'});
  sec.append(head('V', T('選詞填空','选词填空'), 'Fill in the blanks',
    'Tap a word, then tap a blank. Each word is used once. Tap a filled blank to take its word back.'));
  const bank = el('div',{class:'bank', 'aria-label':'Word bank'});
  const para = el('div',{class:'para han'});
  const fb = el('div',{class:'fb'});
  const bl = blanks();
  function draw(){
    bank.textContent = ''; para.textContent = '';
    const used = new Set(Object.values(filled));
    DATA.bank.forEach((w, j) => {
      bank.append(el('button',{type:'button', class:'bw han' + (used.has(j)?' used':''), 'aria-pressed':String(picked===j),
        disabled: used.has(j), onclick:() => { picked = picked===j ? null : j; draw(); }}, Z(w)));
    });
    let n = 0;
    DATA.fill.forEach((p, i) => {
      if (!Array.isArray(p)) { para.append(Z(p)); return; }
      n++;
      const st = S.f[i];
      const has = filled[i] != null;
      const slot = el('button',{type:'button', class:'slot han' + (has?'':' empty') + (st?' '+st:''), 'aria-label':'Blank ' + n},
        el('span',{class:'n'}, n), has ? Z(DATA.bank[filled[i]]) : '');
      slot.addEventListener('click', () => {
        if (S.f[i]==='ok') return;
        if (picked != null) { filled[i] = picked; picked = null; }
        else if (has) { delete filled[i]; }
        delete S.f[i]; save(); draw(); refreshNav();
      });
      para.append(slot);
    });
  }
  function check(){
    let right = 0;
    bl.forEach(i => {
      if (filled[i] == null) return;
      const word = DATA.bank[filled[i]].t;
      const ok = DATA.fill[i].some(a => a.t === word);
      S.f[i] = ok ? 'ok' : 'no'; if (ok) right++;
    });
    save(); refreshNav(); draw();
    const empty = bl.filter(i => filled[i]==null).length;
    fb.textContent = `${right} of ${bl.length} correct` + (empty ? ` · ${empty} still empty` : '') + '. Wrong blanks are red: tap one to clear it and try again.';
  }
  draw();
  sec.append(bank, para, el('div',{class:'bar'},
    el('button',{class:'btn primary', type:'button', onclick:check}, 'Check'),
    el('button',{class:'btn', type:'button', onclick:() => { filled = {}; picked = null; bl.forEach(i=>delete S.f[i]); save(); refreshNav(); draw(); fb.textContent=''; }}, 'Clear all'),
    sayBtn(() => DATA.fill.map((p,i)=>Array.isArray(p) ? Z(p[0]) : Z(p)).join(''), 'Listen to the paragraph')), fb);
  return sec;
}

/* ===== VI. Translate ===== */
const strip = s => s.replace(/[\s，。,.！!？?、；;：:"“”'‘’]/g,'');
function renderTrans(){
  const sec = el('section',{class:'sec'});
  sec.append(head('VI', T('翻譯','翻译'), 'Translate into characters',
    'Write your answer, then check. If yours is different from the model but still correct, mark it yourself.'));
  const list = el('div',{class:'q-list'});
  DATA.trans.forEach((t, i) => {
    const ta = el('textarea',{id:'tr-'+i, rows:'2', class:'han', 'aria-label':'Your translation', lang:'zh'});
    const out = el('div',{});
    const mark = el('span',{class:'mark'});
    const showModel = () => {
      out.textContent = '';
      const self = el('div',{class:'bar'},
        el('button',{class:'btn', type:'button', onclick:()=>{ S.tr[i]='ok'; save(); refreshNav(); paint(); }}, 'Mine is right'),
        el('button',{class:'btn', type:'button', onclick:()=>{ S.tr[i]='no'; save(); refreshNav(); paint(); }}, 'Not yet'));
      out.append(el('div',{class:'t-model'},
        ...t.m.map(m => el('div',{class:'m han'}, Z(m))),
        el('div',{class:'tip'}, Z(t.tip))), S.tr[i] ? null : self);
    };
    const paint = () => { mark.className = 'mark ' + (S.tr[i]||''); mark.textContent = S.tr[i]==='ok' ? '✓' : S.tr[i]==='no' ? '✗' : ''; if (S.tr[i]) showModel(); };
    const check = () => {
      const mine = strip(ta.value);
      if (!mine) return;
      if (t.m.some(m => strip(Z(m)) === mine)) { S.tr[i] = 'ok'; save(); refreshNav(); paint(); }
      else showModel();
    };
    list.append(el('div',{class:'q t-item'},
      el('div',{class:'bar'}, el('span',{class:'num fb'}, (i+1)+'.'), el('span',{class:'t-en'}, t.en), mark),
      ta, el('div',{class:'bar'}, el('button',{class:'btn primary', type:'button', onclick:check}, 'Check')), out));
    if (S.tr[i]) paint();
  });
  sec.append(list);
  return sec;
}

/* ===== VII. Reading ===== */
function clozes(){ return DATA.reading.map((p,i)=>typeof p==='object' && p.o ? i : -1).filter(i=>i>=0); }
function renderRead(){
  const sec = el('section',{class:'sec'});
  sec.append(head('VII', T('閱讀','阅读'), 'Reading',
    'Choose the word for each gap, then decide if each sentence below is true or false. This story is a new version, written for practice.'));
  const pass = el('div',{class:'passage han'});
  DATA.reading.forEach((p, i) => {
    if (!(typeof p==='object' && p.o)) { pass.append(Z(p)); return; }
    const z = el('span',{class:'cz', role:'group', 'aria-label':'Choose a word'});
    p.o.forEach((o, j) => {
      const b = el('button',{type:'button'}, Z(o));
      b.addEventListener('click', () => { if (S.rd[i]) return; S.rd[i] = j===p.a ? 'ok':'no'; save(); refreshNav(); paint(j); });
      z.append(b);
    });
    const paint = pick => [...z.children].forEach((b,j)=>{ b.disabled = true; if (j===p.a) b.classList.add('ok'); else if (j===pick) b.classList.add('no'); });
    if (S.rd[i]) paint(S.rd[i]==='ok' ? p.a : -1);
    pass.append(z);
  });
  const fullText = () => DATA.reading.map(p => (typeof p==='object' && p.o) ? Z(p.o[p.a]) : Z(p)).join('');
  sec.append(el('div',{class:'bar'}, sayBtn(fullText, 'Listen to the story'), el('span',{class:'fb'}, 'Listen to the whole story')), pass);
  const tf = el('div',{class:'tf card'});
  DATA.tf.forEach((q, i) => {
    tf.append(mcq(S.tf, i, ['T','F'], q.a ? 0 : 1, null), el('div',{class:'s han'}, Z(q.q)));
  });
  sec.append(el('h3',{class:'fb', style:'margin:0'}, 'True or false'), tf);
  return sec;
}

/* ---------- controls ---------- */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.m; save(); render(); }));
let resetArmed = false;
$('#reset').addEventListener('click', e => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = 'Tap again to clear all'; setTimeout(()=>{ resetArmed=false; e.target.textContent='Start over'; }, 3000); return; }
  Object.assign(S, {w:{}, p:{}, g:{}, r:{}, f:{}, tr:{}, rd:{}, tf:{}}); filled = {}; picked = null;
  save(); resetArmed = false; e.target.textContent = 'Start over'; render();
});
const h = (location.hash||'').slice(1);
if (SECTIONS.some(s=>s.id===h)) S.tab = h;
render();
</script>
